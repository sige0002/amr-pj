<text x="15" y="138" font-size="2.9" text-anchor="start" font-weight="normal" fill="#152331">輪郭度は切欠き以外の受け壁に適用。背側配線幅6.5±0.10、前・下端9.5は一般公差。R9.67に別の位置誤差±0.05を加算しない。</text>
<text x="15" y="145" font-size="2.9" text-anchor="start" font-weight="normal" fill="#152331">データムA/Bを侵す面取り不可。バリ取りC0.1以下。M6頭側はC0.3±0.1。厚い皮膜なし。</text>
<text x="15" y="152" font-size="2.9" text-anchor="start" font-weight="normal" fill="#152331">web根元は元A4同様。形状に影響する工具Rは提案・再審査。全体へ±0.05を一律指定するものではない。</text>
<text x="15" y="161" font-size="3.8" text-anchor="start" font-weight="bold" fill="#152331">組付け条件と公差の使い方（完成機の許容荷重・安全率を証明する記載ではない）</text>
<text x="15" y="170" font-size="2.9" text-anchor="start" font-weight="normal" fill="#152331">1. 公称モータ軸Z15.35、受け軸Z15.18。タイヤ反力側の輪郭（車体+Z）へボスを着座させて端面を締結。</text>
<text x="15" y="179" font-size="2.9" text-anchor="start" font-weight="normal" fill="#152331">2. 公表ボスØ18.85…19.05／平面距離7.85…8.15の条件で着座量0.04…0.295、穴群中心から−0.130…+0.125。</text>
<text x="15" y="188" font-size="2.9" text-anchor="start" font-weight="normal" fill="#152331">3. 金具孔位置半径0.05＋実モータ孔群偏心0.05以下を受入条件とする。モータ側0.05は未確認の条件。</text>
<text x="15" y="197" font-size="2.9" text-anchor="start" font-weight="normal" fill="#152331">4. 最大中心差0.130+0.10=0.230 &lt; (3.2−2.5)/2=0.350。片側余裕0.120は上記条件が成立した場合のみ。</text>
<text x="15" y="206" font-size="2.9" text-anchor="start" font-weight="normal" fill="#152331">5. M2.5×12＋小径座金t0.5、座ぐり底背肉7.5で公称ねじ込み4。首元・座金・穴底を現物確認。</text>
<text x="15" y="215" font-size="2.9" text-anchor="start" font-weight="normal" fill="#152331">6. 3本の同時挿入、荷重側輪郭接触、端面/頭/座金の全周座り、配線φ6予約を確認。全面同時接触とは仮定しない。</text>
<text x="15" y="224" font-size="2.9" text-anchor="start" font-weight="normal" fill="#152331">7. 装着高さ・タイヤの荷重たわみを測り、キャスター接地を再調整。CAD公称接地0は現物の高さ保証ではない。</text>
<text x="15" y="233" font-size="2.9" text-anchor="start" font-weight="normal" fill="#152331">8. 材質証明、ねじ規格、実ナット/フレーム溝寸法、接触・ねじ山・溝縁の荷重確認後に製作/運用を判断。</text>
<text x="15" y="248" font-size="3" text-anchor="start" font-weight="normal" fill="#152331">比較基準：A4 幅90/厚5/孔ピッチ75を維持。D5幅75/厚6は価格低減せず、今回の採用対象から外す。</text>
<text x="15" y="257" font-size="2.9" text-anchor="start" font-weight="normal" fill="#152331">引用元の motor STEP / メーカー寸法図 / 公開ブラケット輪郭は MOUNT_INTERFACE_REVIEW.ja.md を参照。</text>
