name: Import validated AMR design package
on:
  push:
    branches: [main]
    paths: ['.github/amr-transfer/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: amr-design-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Import package after integrity validation
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/amr-transfer/import_package.py ]; then
            python3 .github/amr-transfer/import_package.py
          fi
      - name: Validate design calculations and documentation
        working-directory: docs/amr-01
        run: |
          python3 check_design.py > /tmp/amr-calculation-output.txt
          python3 -m unittest -v test_check_design.py
      - name: Publish design and archive without touching CAD
        shell: bash
        run: |
          set -euo pipefail
          git add docs/amr-01/ archives/
          git add -u
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='AMR design publisher' -c user.email='amr-design@users.noreply.github.com' commit -m 'docs: publish AMR-01 v0.2.1 design, internal structure figure and ZIP'
          git push origin HEAD:main
